<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Erbakan Dijital Arşivi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B132B;
       color:#e8ecf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  .k{max-width:540px}
  h1{font-size:1.35rem;margin:0 0 10px;color:#D4AF37;font-weight:700}
  p{color:#9aa3b2;font-size:.95rem;line-height:1.6;margin:0 0 20px}
  a.b{display:inline-block;padding:13px 26px;border-radius:10px;text-decoration:none;font-weight:700;
      background:linear-gradient(135deg,#D4AF37,#C8102E);color:#fff}
  small{display:block;margin-top:22px;color:#5f6879;font-size:.78rem;line-height:1.5}
  .u{color:#C8102E;font-weight:600}
</style>
</head>
<body>
  <div class="k">
    <h1>Prof. Dr. Necmettin Erbakan — Dijital Arşiv</h1>
    <p id="d">Güncel adres alınıyor…</p>
    <a class="b" id="g" style="display:none">Arşive Git</a>
    <small>Arşiv yayın adresi zaman zaman değişir; bu sayfa her zaman güncel adrese yönlendirir.</small>
  </div>
<script>
// Adres, depodaki adres.json'dan okunur. raw.githubusercontent push'tan saniyeler
// sonra günceldir — GitHub Pages'in ~1 dakikalık yayın gecikmesini atlar.
// Böylece tünel adresi değiştiğinde bu sayfa anında doğru yere gider.
var KAYNAK = "https://raw.githubusercontent.com/xawiar/erbakanasor/main/adres.json";
var d = document.getElementById("d"), g = document.getElementById("g");

function goster(u, otomatik) {
  g.href = u; g.style.display = "inline-block";
  d.innerHTML = otomatik ? "Arşive yönlendiriliyorsunuz…" :
    "Arşiv şu an kapalı olabilir.<br>Yayın bilgisayarı açıkken erişilebilir.";
  if (otomatik) setTimeout(function(){ location.replace(u); }, 500);
}

fetch(KAYNAK + "?t=" + Date.now(), {cache: "no-store"})
  .then(function(r){ return r.json(); })
  .then(function(j){
    var u = j.adres;
    if (!u) throw new Error("adres yok");
    // Adres gerçekten ayakta mı — ölü tünele yönlendirip hata sayfası göstermeyelim
    return fetch(u + "/arsiv.html", {method:"HEAD", mode:"no-cors", cache:"no-store"})
      .then(function(){ goster(u + "/arsiv.html", true); })
      .catch(function(){ goster(u + "/arsiv.html", false); });
  })
  .catch(function(){
    d.innerHTML = '<span class="u">Güncel adres alınamadı.</span><br>Birazdan tekrar deneyin.';
  });
</script>
</body>
</html>
